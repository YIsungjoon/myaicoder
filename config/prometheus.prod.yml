global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "gateway"
    static_configs:
      - targets: ["gateway:8080"]
    metrics_path: /metrics
    scrape_interval: 10s

  - job_name: "llama-9b"
    static_configs:
      - targets: ["llama-9b:8080"]
    metrics_path: /metrics
    scrape_interval: 30s

  - job_name: "llama-27b"
    static_configs:
      - targets: ["llama-27b:8080"]
    metrics_path: /metrics
    scrape_interval: 30s

  - job_name: "llama-coder"
    static_configs:
      - targets: ["llama-coder:8080"]
    metrics_path: /metrics
    scrape_interval: 30s
