[project]
name = "myaicoder"
version = "0.1.0"
description = "AI Coding Assistant powered by local LLM (Qwen3.5-27B) with MCP support"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "openai>=1.0",
    "pydantic>=2.0",
    "aiofiles>=23.0",
    "httpx>=0.27",
    "mcp[cli]>=1.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]
mcp = [
    "mcp>=1.0",
]

[project.scripts]
myaicoder = "myaicoder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/myaicoder"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
